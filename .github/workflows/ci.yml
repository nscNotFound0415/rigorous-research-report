name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: module-tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no third-party deps required)
        run: python -m pip install --upgrade pip
      - name: Module tests
        run: python -m pytest tests/ -q

  e2e:
    name: end-to-end (with libreoffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install LibreOffice (for docx->pdf conversion)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: End-to-end suite
        run: bash tests/e2e/run_e2e.sh
      - name: Spec validation
        run: |
          if command -v openspec >/dev/null 2>&1; then
            openspec validate --all --strict
          else
            echo "openspec CLI not available; skipping spec validation"
          fi
